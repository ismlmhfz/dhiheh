{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch table {{ code }} · Card Party</title><link rel="stylesheet" href="{% static 'community.css' %}?v=1"><link rel="stylesheet" href="{% static 'spectator.css' %}?v=1">{% include 'branding_head.html' %}<link rel="stylesheet" href="{% static 'royal-table.css' %}?v=1"></head><body>
<header class="community-header">{% include 'brand.html' %}<nav><a href="/">Play cards</a><a href="/friends/">Friends &amp; chats</a></nav></header>
<main id="spectator" data-code="{{ code }}"><div class="page-heading"><div><p class="eyebrow">LIVE SPECTATOR VIEW</p><h1>Table {{ code }}</h1><p class="muted">Watch the plays. All players’ hands stay private.</p></div><div class="watch-actions"><button id="copy-watch-link">Copy spectator link</button><a id="watch-join" class="primary" href="/room/{{ code }}/" hidden>Join a seat</a><a id="watch-group" href="/friends/" hidden>Group chat</a></div></div><p id="watch-status" role="status">Connecting to the table…</p><div id="watch-scores"></div><div id="watch-trump"></div><section id="watch-board" aria-label="Spectator table"><div id="watch-players"></div><div id="watch-cards"></div><div id="watch-table-message" role="status"></div></section><p id="watch-turn" role="status"></p><section class="watch-history-panel"><h2>Recent stacks</h2><div id="watch-history"></div></section></main><script src="{% static 'spectator.js' %}?v=1"></script></body></html>
